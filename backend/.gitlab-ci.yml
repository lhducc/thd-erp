stages:
    - lint
    - sast
    - build
    - deploy

sast-backend:
  stage: sast
  image: securego/gosec
  script:
    - gosec -fmt sarif -out gl-sast-report.json ./...
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    when: always

build:
  stage: build
  script:
    - echo "build"

deploy:
  stage: deploy
  script: echo "deploy"
