gosec-sast:
  stage: test
  variables:
    SEARCH_MAX_DEPTH: 4
  image: 10.57.70.41:5001/product/erp/erp/analyzers/gosec:latest
  script:
    - echo "hello"
    - "/analyzer run"
  allow_failure: true
  artifacts:
    reports:
      sast:
        - backend/gl-sast-report.json
  rules:
  #  - if: '$CI_COMMIT_BRANCH && $CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH'


semgrep-sast:
  stage: test
  image:
    name: 10.57.70.41:5001/product/erp/erp/analyzers/semgrep:latest
  script:
    - /analyzer run
  allow_failure: true
  artifacts:
    reports:
      sast: backend/gl-sast-report.json
    paths:
      - backend/gl-sast-report.json
    when: always
  allow_failure: true
  rules:
    #- if: '$CI_COMMIT_BRANCH && $CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH'
      exists:
        - "**/*.go"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.py"
        - "**/*.java"
        - "**/*.c"


secret-detect:
  stage: test
  image:
    name: 10.57.70.41:5001/product/erp/erp/secrets:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - gl-secret-detection-report.json
    when: always
  allow_failure: true
  rules:
  - if: '$CI_COMMIT_BRANCH'


#### Build Stage

build-image:
  stage: build
  script:
    - docker build -t ${BE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG} .
    - docker save ${BE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG} -o image.tar
  artifacts:
    paths:
      - ./backend/image.tar
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: on_success

healcheck-image:
  stage: build
  script:
    - echo "healthy check"
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
  needs: [build-image]

sec-scan-image:
  stage: build
  script:
    - echo "sec scan image"
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
  needs: [build-image]

push-image-dev-registry:
  stage: build
  script:
    - echo "push image ${BE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG} to container registry"
    - docker push ${BE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG}
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
  needs: [healcheck-image, sec-scan-image]

scan_image:
  stage: build
  image: 
    name: 10.57.70.41:5001/product/erp/erp/security-products/container-scanning:8
  variables:
    CS_IMAGE: ${BE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG}
    CS_SCHEMA_MODEL: 15
  allow_failure: true
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
      cyclonedx: "**/gl-sbom-*.cdx.json"
    paths: 
      - backend/gl-container-scanning-report.json
      - "**/gl-sbom-*.cdx.json"
  script:
    - echo "Bắt đầu chạy gtcs scan..."
    - gtcs scan

  needs: [healcheck-image, sec-scan-image, build-image]

buildandpush-uat-image:
  stage: build
  script:
    - docker build -t ${BE_CONTAINER_IMAGE}:${UAT_CONTAINER_TAG} .
    - docker push ${BE_CONTAINER_IMAGE}:${UAT_CONTAINER_TAG}
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_TAG =~ /^uat_/'
