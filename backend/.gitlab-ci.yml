default:
  before_script:
    - cd backend

variables:
  CONTAINER_IMAGE: ${REGISTRY_URL}/${REGISTRY_PROJECT}/${CI_PROJECT_NAME}-backend

stages:
    - test
    - build
    - deploy


#### Test Stage


style-check:
  stage: test
  image: 10.57.70.41:5001/product/erp/erp/golangci/golangci-lint:v2.1.6
  script:
    - golangci-lint run -v --timeout=5m
  only:
    - merge_requests

unit-test:
  stage: test
  image: 10.57.70.41:5001/product/erp/erp/golang:1.22-alpine
  script:
    - go test -coverprofile=coverage.out -v ./...
    - go tool cover -func=coverage.out > coverage.txt
    - cat coverage.txt
  artifacts:
    when: always
    paths:
      - coverage.out
      - coverage.txt
  only:
    - merge_requests

gosec-sast:
  stage: test
  variables:
    SEARCH_MAX_DEPTH: 4
  image: 10.57.70.41:5001/product/erp/erp/analyzers/gosec:latest
  script:
    - echo "hello"
    - "/analyzer run"
  allow_failure: true
  artifacts:
    reports:
      sast:
      - gl-sast-report.json
  only:
    - merge_requests


semgrep-sast:
  stage: test
  image:
    name: 10.57.70.41:5001/product/erp/erp/analyzers/semgrep:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    when: always
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_MERGE_REQUEST_ID'
      exists:
        - "**/*.go"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.py"
        - "**/*.java"
        - "**/*.c"

secret-detect:
  stage: test
  image:
    name: 10.57.70.41:5001/product/erp/erp/secrets:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - gl-secret-detection-report.json
    when: always
  allow_failure: true
  rules:
  - if: '$CI_COMMIT_BRANCH && $CI_MERGE_REQUEST_ID'


#### Build Stage


build-image:
  stage: build
  script:
    - apk --no-cache add update-ca-certificates
    - update-ca-certificates
    - docker build -t ${CONTAINER_IMAGE}:dev-${CI_COMMIT_SHORT_SHA} .
    - docker save ${CONTAINER_IMAGE}:dev-${CI_COMMIT_SHORT_SHA} -o image.tar
  artifacts:
    paths:
      - image.tar
  tags:
    - uat
  rules:
    - when: on_success

healcheck-image:
  stage: build
  script:
    - echo "healthy check"
  tags:
    - uat
  rules:
    - when: on_success
  needs: [build-image]

sec-scan-image:
  stage: build
  script:
    - echo "sec scan image"
  tags:
    - uat
  rules:
    - when: on_success
  needs: [build-image]

push-image-dev-registry:
  stage: build
  script:
    - echo "healthy check"
  tags:
    - uat
  rules:
    - when: on_success
  needs: [healcheck-image, sec-scan-image]


#### Deploy Stage


deploy:
  stage: deploy
  script: echo "deploy"
