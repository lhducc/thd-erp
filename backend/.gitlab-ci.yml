default:
  before_script:
    - cd backend

variables:
  CONTAINER_IMAGE: ${REGISTRY_URL}/${REGISTRY_PROJECT}/${CI_PROJECT_NAME}-backend:${CI_COMMIT_TAG:-notag}-${CI_COMMIT_SHORT_SHA}

stages:
    - lint
    - test
    - build
    - deploy

lint:
  stage: lint
  image: 10.57.70.41:5001/product/erp/erp/golangci/golangci-lint:v2.1.6
  script:
    - golangci-lint run -v --timeout=5m
  only:
    - merge_requests

unit-test:
  stage: test
  image: 10.57.70.41:5001/product/erp/erp/golang:1.22-alpine
  script:
    - go test -coverprofile=coverage.out -v ./...
    - go tool cover -func=coverage.out > coverage.txt
    - cat coverage.txt
  artifacts:
    when: always
    paths:
      - coverage.out
      - coverage.txt
  only:
    - merge_requests

gosec-sast:
  stage: test
  variables:
    SEARCH_MAX_DEPTH: 4
  image: 10.57.70.41:5001/product/erp/erp/analyzers/gosec:latest
  script:
    - echo "hello"
    - "/analyzer run"
  allow_failure: true
  artifacts:
    reports:
      sast:
      - gl-sast-report.json

semgrep-sast:
  stage: sast
  image:
    name: 10.57.70.41:5001/product/erp/erp/analyzers/semgrep:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    when: always
  allow_failure: true
  rules:
    - if: "$CI_COMMIT_BRANCH"
      exists:
        - "**/*.go"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.py"
        - "**/*.java"
        - "**/*.c"

build:
  stage: build
  script:
    - docker build -t ${CONTAINER_IMAGE} .
    - docker push ${CONTAINER_IMAGE}
    - docker rm ${CONTAINER_IMAGE}
  tags:
    - uat

deploy:
  stage: deploy
  script: echo "deploy"
