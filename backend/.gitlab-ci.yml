stages:
    - lint
    - sast
    - build
    - deploy


lint:
  stage: lint
  image: golangci/golangci-lint:v1.56
  script:
    - cd backend
    - golangci-lint run --timeout 5m

sast-backend:
  stage: sast
  image: securego/gosec
  script:
    - cd backend
    - gosec -fmt sarif -out gl-sast-report.json ./...
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    when: always

build:
  stage: build
  script:
    - echo "build"

deploy:
  stage: deploy
  script: echo "deploy"
