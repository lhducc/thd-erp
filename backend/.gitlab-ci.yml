include:
  - template: Security/SAST.gitlab-ci.yml

stages:
    - lint
    - build
    - test
    - deploy

lint:
  stage: lint
  image: golangci/golangci-lint:v1.56
  script:
    - golangci-lint run --timeout 5m

build:
  stage: build
  script:
    - echo "build"

test:
  stage: test

deploy:
  stage: deploy
  script: echo "deploy"
