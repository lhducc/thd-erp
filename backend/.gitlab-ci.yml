default:
  before_script:
    - cd backend

variables:
  BE_CONTAINER_IMAGE: ${REGISTRY_URL}/${REGISTRY_PROJECT}/${CI_PROJECT_NAME}-backend
  DEV_CONTAINER_TAG: dev-${CI_COMMIT_SHORT_SHA}
  UAT_CONTAINER_TAG: ${CI_COMMIT_TAG}-${CI_COMMIT_SHORT_SHA}

stages:
    - test
    - build

#### Test Stage

style-check:
  stage: test
  image: 10.57.70.41:5001/product/erp/erp/golangci/golangci-lint:v2.1.6
  script:
  - golangci-lint run -v --timeout=5m > golangci-lint.log 2>&1 || true
  artifacts:
    when: always
    paths:
      - backend/golangci-lint.log
  rules:
    - if: '$CI_COMMIT_BRANCH'

