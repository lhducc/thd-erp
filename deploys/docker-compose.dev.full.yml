services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - ../.env
    volumes:
      - ../frontend:/app
      - /app/node_modules
  backend:
    container_name: erp-backend
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
      - go-mod:/go/pkg/mod      # Cache module (go mod download)
      - go-build:/root/.cache/go-build  # Cache build
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    depends_on:
      - postgres
      - minio
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: erp-postgres
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: erp-minio
    command: server --console-address ":9001" /data
    env_file:
      - ../.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
  go-mod:
  go-build:

