services:
  frontend:
    container_name: erp-frontend
    # image: ${FE_CONTAINER_IMAGE:-192.168.1.76:5001/product/erp/erp/frontend}:${CONTAINER_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://192.168.1.58/api/v1}
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env
    depends_on:
      - backend
    networks:
      - erp-network
    restart: unless-stopped

  backend:
    container_name: erp-backend
    # image: ${BE_CONTAINER_IMAGE:-192.168.1.76:5001/product/erp/erp/backend}:${CONTAINER_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Ports removed - backend only accessible through frontend reverse proxy
    expose:
      - "8080"
      - "8443"
    environment:
      - AUTO_MIGRATE=true
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - erp-network
    restart: unless-stopped
  # Note: Backend must be configured to connect to Postgres and MinIO using SSL/TLS (see below)

  postgres:
    # image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    image: 192.168.1.76:5001/product/erp/erp/postgres:15-alpine
    container_name: erp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_pass}
      # Performance tuning settings
      POSTGRES_INITDB_ARGS: "--data-checksums"
    env_file:
    - ../.env
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=1GB
      -c random_page_cost=1.1
      -c wal_buffers=16MB
      -c max_connections=200
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c log_min_duration_statement=500
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - erp-network

  postgres-replica:
    # image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    image: 192.168.1.76:5001/product/erp/erp/postgres:15-alpine
    container_name: erp-postgres-replica
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_MASTER_SERVICE: postgres
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_pass}
      PGUSER: ${POSTGRES_USER:-erp_user}
    env_file:
      - ../.env
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=512MB
      -c random_page_cost=1.1
      -c wal_buffers=8MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c log_min_duration_statement=500
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network

  minio:
    # image: ${MINIO_IMAGE:-minio/minio:latest}
    image: 192.168.1.76:5001/product/erp/erp/minio:latest
    container_name: erp-minio
    command: server --console-address ":9001" /data
    env_file:
      - ../.env
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Enable HTTPS for MinIO
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-https://192.168.1.58:9000}
    healthcheck:
      test: ["CMD", "curl", "-kf", "${MINIO_HEALTH_URL:-https://192.168.1.58:9000/minio/health/ready}"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data
      # Mount SSL certificates for MinIO (must be named public.crt and private.key)
      - ../ssl/minio.crt:/root/.minio/certs/public.crt:ro
      - ../ssl/minio.key:/root/.minio/certs/private.key:ro
    networks:
      - erp-network
    restart: unless-stopped

volumes:
  pgdata:
  pgdata_replica:
  minio_data:

networks:
  erp-network:
    driver: bridge
