default:
  before_script:
    - cd frontend

variables:
  FE_CONTAINER_IMAGE: ${REGISTRY_URL}/${REGISTRY_PROJECT}/${CI_PROJECT_NAME}-frontend
  DEV_CONTAINER_TAG: dev-${CI_COMMIT_SHORT_SHA}
  UAT_CONTAINER_TAG: ${CI_COMMIT_TAG}-${CI_COMMIT_SHORT_SHA}

stages:
    - test
    - build

