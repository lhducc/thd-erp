semgrep-sast:
  stage: test
  image:
    name: 10.57.70.41:5001/product/erp/erp/analyzers/semgrep:latest
  script:
    - /analyzer run
  allow_failure: true
  artifacts:
    reports:
      sast: frontend/gl-sast-report.json
    paths:
      - frontend/gl-sast-report.json
    when: always
  allow_failure: true
  rules:
    #- if: '$CI_COMMIT_BRANCH && $CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH'
      exists:
        - "**/*.go"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.py"
        - "**/*.java"
        - "**/*.c"

secret-detect:
  stage: test
  image:
    name: 10.57.70.41:5001/product/erp/erp/secrets:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - gl-secret-detection-report.json
    when: always
  allow_failure: true
  rules:
  - if: '$CI_COMMIT_BRANCH'


#### Build Stage

build-image:
  stage: build
  script:
    - docker build -t ${FE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG} .
    - docker save ${FE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG} -o image.tar
  artifacts:
    paths:
      - ./frontend/image.tar
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_BRANCH'

healcheck-image:
  stage: build
  script:
    - echo "healthy check"
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
  needs: [build-image]

# sec-scan-image:
#   stage: build
#   script:
#     - echo "sec scan image"
#   tags:
#     - uat
#   rules:
#     - if: '$CI_COMMIT_BRANCH'
#       when: on_success
#   needs: [build-image]

sec-scan-image:
  stage: build
  image: 
    name: 10.57.70.41:5001/product/erp/erp/security-products/container-scanning:8
  variables:
    CS_IMAGE: ${FE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG}
    CS_SCHEMA_MODEL: 15
  allow_failure: true
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
      cyclonedx: "**/gl-sbom-*.cdx.json"
    paths: 
      - frontend/gl-container-scanning-report.json
      - "**/gl-sbom-*.cdx.json"
  script:
    - echo "Bắt đầu chạy gtcs scan..."
    - gtcs scan

  needs: [healcheck-image,build-image]

push-image-dev-registry:
  stage: build
  script:
    - echo "push image ${FE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG} to container registry"
    - docker push ${FE_CONTAINER_IMAGE}:${DEV_CONTAINER_TAG}
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_BRANCH'
  needs: [healcheck-image, sec-scan-image]

buildandpush-uat-image:
  stage: build
  script:
    - docker build -t ${FE_CONTAINER_IMAGE}:${UAT_CONTAINER_TAG} .
    - docker push ${FE_CONTAINER_IMAGE}:${UAT_CONTAINER_TAG}
  tags:
    - uat
  rules:
    - if: '$CI_COMMIT_TAG =~ /^uat_/'
